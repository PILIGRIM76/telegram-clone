name: Build Android Release

on:
  push:
    tags:
      - 'v*' # Запускается при создании тегов версии

jobs:
  build-android:
    runs-on: ubuntu-24.04 # Используем зафиксированную версию ОС

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24' # Явно указываем Node 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Web Assets
        run: npm run build

      - name: Sync Capacitor
        run: npx cap sync android

      # ИСПРАВЛЕНИЕ: Переход на setup-java@v5
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle' # Кэширование зависимостей Gradle для скорости

      - name: Grant execute permission for gradlew
        working-directory: ./android
        run: chmod +x gradlew

      - name: Build Debug APK
        working-directory: ./android
        run: |
          ./gradlew assembleDebug --stacktrace --info
        env:
          JAVA_HOME: ${{ env.JAVA_HOME }} # Убеждаемся, что переменная окружения установлена

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: cipherlink-android-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
