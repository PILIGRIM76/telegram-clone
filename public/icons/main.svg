<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Градиентный фон: глубокий cyan-teal (цвет бренда CipherLink) -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0891b2"/>
      <stop offset="50%" stop-color="#0e7490"/>
      <stop offset="100%" stop-color="#164e63"/>
    </linearGradient>
    <!-- Радиальный градиент для блика -->
    <radialGradient id="shineGradient" cx="30%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#67e8f9" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#67e8f9" stop-opacity="0"/>
    </radialGradient>
    <!-- Градиент для замка -->
    <linearGradient id="lockGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e0f2fe"/>
    </linearGradient>
    <!-- Тень для глубины -->
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="6"/>
      <feOffset dx="0" dy="4" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.3"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Фон: закругленный квадрат с градиентом -->
  <rect width="512" height="512" rx="96" ry="96" fill="url(#bgGradient)"/>
  <!-- Блик -->
  <rect width="512" height="512" rx="96" ry="96" fill="url(#shineGradient)"/>

  <!-- Волны (подсказывает тематику безопасности) -->
  <g opacity="0.12" stroke="#67e8f9" stroke-width="2" fill="none">
    <path d="M 30 380 Q 128 340, 226 380 T 422 380 T 482 380"/>
    <path d="M 30 410 Q 128 370, 226 410 T 422 410 T 482 410"/>
    <path d="M 30 440 Q 128 400, 226 440 T 422 440 T 482 440"/>
  </g>

  <!-- Замок (тело) -->
  <g filter="url(#dropShadow)">
    <!-- Тело замка -->
    <rect x="160" y="220" width="192" height="200" rx="20" ry="20" fill="url(#lockGradient)"/>
    <!-- Скважина для ключа -->
    <circle cx="256" cy="310" r="20" fill="#0891b2"/>
    <rect x="252" y="310" width="8" height="50" fill="#0891b2"/>
  </g>

  <!-- Дуга замка (скоба) -->
  <path d="M 192 220 L 192 176 Q 192 130, 256 130 Q 320 130, 320 176 L 320 220"
        fill="none" stroke="url(#lockGradient)" stroke-width="22" stroke-linecap="round"/>

  <!-- Блик на замке -->
  <rect x="170" y="232" width="20" height="180" rx="10" ry="10" fill="#ffffff" opacity="0.25"/>
</svg>