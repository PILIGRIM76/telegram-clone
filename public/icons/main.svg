<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="mainGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c3aed" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="keyGradient" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#e0e7ff" stop-opacity="1" />
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="112" ry="112" fill="url(#mainGradient)" />

  <g transform="translate(256, 256)">
    <!-- Wi-Fi waves left -->
    <path d="M -120,0 A 120,120 0 0,1 -80,-88" fill="none" stroke="#ffffff" stroke-width="16" stroke-linecap="round" stroke-opacity="0.25" />
    <path d="M -100,0 A 100,100 0 0,1 -70,-70" fill="none" stroke="#ffffff" stroke-width="16" stroke-linecap="round" stroke-opacity="0.4" />
    <path d="M -80,0 A 80,80 0 0,1 -56,-56" fill="none" stroke="#ffffff" stroke-width="16" stroke-linecap="round" stroke-opacity="0.7" />
    <!-- Wi-Fi waves right -->
    <path d="M 120,0 A 120,120 0 0,0 80,-88" fill="none" stroke="#ffffff" stroke-width="16" stroke-linecap="round" stroke-opacity="0.25" />
    <path d="M 100,0 A 100,100 0 0,0 70,-70" fill="none" stroke="#ffffff" stroke-width="16" stroke-linecap="round" stroke-opacity="0.4" />
    <path d="M 80,0 A 80,80 0 0,0 56,-56" fill="none" stroke="#ffffff" stroke-width="16" stroke-linecap="round" stroke-opacity="0.7" />

    <!-- Key head (ring) -->
    <circle cx="0" cy="-32" r="28" fill="none" stroke="url(#keyGradient)" stroke-width="16" />
    <!-- Key body -->
    <rect x="-8" y="-4" width="16" height="100" rx="8" fill="url(#keyGradient)" />
    <!-- Key teeth -->
    <rect x="-8" y="60" width="24" height="12" rx="4" fill="url(#keyGradient)" />
    <rect x="-8" y="80" width="18" height="12" rx="4" fill="url(#keyGradient)" />
  </g>
</svg>