
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Админ-панель ШифроСвязь</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .custom-scrollbar::-webkit-scrollbar { width: 8px; height: 8px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #1e293b; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #475569; border-radius: 4px; }
        .log-entry { font-family: monospace; }
        .type-INFO { color: #38bdf8; }
        .type-WARN { color: #facc15; }
        .type-ERROR { color: #f87171; }
        .type-TRAFFIC { color: #4ade80; }
        .type-AUTH { color: #c084fc; }
    </style>
</head>
<body class="bg-slate-900 text-slate-200 font-sans h-screen flex flex-col">

    <header class="bg-slate-800 border-b border-slate-700 p-4 flex justify-between items-center shadow-lg">
        <div class="flex items-center space-x-3">
            <div class="w-8 h-8 bg-red-600 rounded flex items-center justify-center font-bold text-white">A</div>
            <h1 class="text-xl font-bold">ШифроСвязь <span class="text-slate-500 font-normal">| Администрирование</span></h1>
        </div>
        <div class="flex space-x-4">
            <button onclick="loadTab('dashboard')" class="hover:text-cyan-400">Дашборд</button>
            <button onclick="loadTab('users')" class="hover:text-cyan-400">Пользователи</button>
            <button onclick="loadTab('logs')" class="hover:text-cyan-400 font-bold text-cyan-200">Логи (Live)</button>
            <button onclick="loadTab('stores')" class="hover:text-cyan-400">Модерация</button>
            <button onclick="logout()" class="text-red-400 hover:text-red-300">Выход</button>
        </div>
    </header>

    <main class="flex-1 overflow-y-auto p-6 custom-scrollbar" id="content">
        <!-- Content will be loaded here -->
    </main>

    <script>
        const API_URL = '/api/admin';
        let logsInterval = null;

        async function fetchAPI(endpoint, method = 'GET', body = null) {
            const options = { method, headers: { 'Content-Type': 'application/json' } };
            if (body) options.body = JSON.stringify(body);
            
            const res = await fetch(`${API_URL}${endpoint}`, options);
            if (res.status === 401) {
                alert('Сессия истекла или неверный пароль');
                window.location.reload();
                return null;
            }
            return method === 'DELETE' ? res : res.json();
        }

        async function loadTab(tab) {
            if (logsInterval) clearInterval(logsInterval); // Stop log polling if changing tab
            
            const content = document.getElementById('content');
            content.innerHTML = '<div class="text-center mt-10">Загрузка...</div>';

            if (tab === 'dashboard') {
                const stats = await fetchAPI('/stats');
                content.innerHTML = `
                    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6 mb-8">
                        <div class="bg-slate-800 p-6 rounded-lg border border-slate-700">
                            <h3 class="text-slate-400 text-sm font-bold uppercase">Пользователи</h3>
                            <p class="text-3xl font-bold text-white mt-2">${stats.totalUsers}</p>
                            <p class="text-xs text-green-400 mt-1">Онлайн: ${stats.onlineUsers}</p>
                        </div>
                        <div class="bg-slate-800 p-6 rounded-lg border border-slate-700">
                            <h3 class="text-slate-400 text-sm font-bold uppercase">Трафик</h3>
                            <p class="text-3xl font-bold text-white mt-2">${stats.traffic.messages}</p>
                            <p class="text-xs text-slate-500 mt-1">~${(stats.traffic.bytes / 1024 / 1024).toFixed(2)} MB</p>
                        </div>
                        <div class="bg-slate-800 p-6 rounded-lg border border-slate-700">
                            <h3 class="text-slate-400 text-sm font-bold uppercase">Магазины</h3>
                            <p class="text-3xl font-bold text-white mt-2">${stats.publicStores}</p>
                        </div>
                        <div class="bg-slate-800 p-6 rounded-lg border border-slate-700">
                            <h3 class="text-slate-400 text-sm font-bold uppercase">Uptime</h3>
                            <p class="text-xl font-bold text-white mt-2">${formatUptime(stats.traffic.uptime)}</p>
                        </div>
                    </div>

                    <div class="bg-slate-800 p-6 rounded-lg border border-slate-700 max-w-2xl">
                        <h3 class="text-lg font-bold mb-4">Глобальная рассылка</h3>
                        <p class="text-sm text-slate-400 mb-2">Отправить системное уведомление всем пользователям онлайн.</p>
                        <div class="flex space-x-2">
                            <input id="broadcastMsg" type="text" placeholder="Текст сообщения..." class="flex-1 bg-slate-900 border border-slate-600 rounded p-2 text-white">
                            <button onclick="sendBroadcast()" class="bg-indigo-600 px-4 py-2 rounded text-white hover:bg-indigo-700">Отправить</button>
                        </div>
                    </div>
                `;
            } 

            else if (tab === 'logs') {
                content.innerHTML = `
                    <h2 class="text-2xl font-bold mb-4">Системные логи</h2>
                    <div class="bg-slate-950 p-4 rounded border border-slate-800 h-[70vh] overflow-y-auto custom-scrollbar" id="logsContainer">
                        Loading...
                    </div>
                `;
                fetchLogs();
                logsInterval = setInterval(fetchLogs, 3000); // Poll every 3s
            }

            else if (tab === 'users') {
                const users = await fetchAPI('/users');
                content.innerHTML = `
                    <h2 class="text-2xl font-bold mb-6">Список пользователей</h2>
                    <div class="bg-slate-800 rounded-lg overflow-hidden border border-slate-700">
                        <table class="w-full text-left">
                            <thead class="bg-slate-900 text-slate-400 text-xs uppercase">
                                <tr>
                                    <th class="p-4">UID</th>
                                    <th class="p-4">IP</th>
                                    <th class="p-4">Статус</th>
                                    <th class="p-4">Время</th>
                                    <th class="p-4">Магазин</th>
                                    <th class="p-4">Действия</th>
                                </tr>
                            </thead>
                            <tbody class="divide-y divide-slate-700">
                                ${users.map(u => `
                                    <tr class="hover:bg-slate-700/50">
                                        <td class="p-4 font-mono text-xs text-cyan-300 truncate max-w-[150px]">${u.uid}</td>
                                        <td class="p-4 font-mono text-xs text-slate-400">${u.ip}</td>
                                        <td class="p-4"><span class="px-2 py-1 rounded text-xs ${u.isOnline ? 'bg-green-900 text-green-300' : 'bg-slate-600 text-slate-400'}">${u.isOnline ? 'ONLINE' : 'OFFLINE'}</span></td>
                                        <td class="p-4 text-xs text-slate-400">${u.connectionDuration}</td>
                                        <td class="p-4 text-sm">${u.hasStore ? 'Да' : '-'}</td>
                                        <td class="p-4 flex space-x-2">
                                            ${u.isOnline ? `<button onclick="kickUser('${u.uid}')" class="bg-yellow-900/50 text-yellow-300 hover:bg-yellow-900 px-3 py-1 rounded text-xs border border-yellow-800">KICK</button>` : ''}
                                            <button onclick="banUser('${u.uid}')" class="bg-red-900/50 text-red-300 hover:bg-red-900 px-3 py-1 rounded text-xs border border-red-800">BAN</button>
                                        </td>
                                    </tr>
                                `).join('')}
                            </tbody>
                        </table>
                    </div>
                `;
            }

            else if (tab === 'stores') {
                const stores = await fetchAPI('/stores');
                content.innerHTML = `
                    <h2 class="text-2xl font-bold mb-6">Модерация Магазинов</h2>
                    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                        ${stores.map(s => `
                            <div class="bg-slate-800 p-4 rounded border border-slate-700 flex flex-col">
                                <h3 class="font-bold text-lg text-white mb-1">${s.название}</h3>
                                <p class="text-xs text-cyan-400 font-mono mb-2 truncate">${s.uid}</p>
                                <p class="text-sm text-slate-400 flex-1 mb-4 line-clamp-3">${s.описание}</p>
                                <div class="flex justify-between items-center text-xs text-slate-500 mb-4">
                                    <span>${s.тип}</span>
                                    <span>${s.товары ? s.товары.length : 0} товаров</span>
                                </div>
                                <button onclick="deleteStore('${s.uid}')" class="w-full bg-red-600 text-white py-2 rounded text-sm hover:bg-red-700">Удалить магазин</button>
                            </div>
                        `).join('')}
                    </div>
                `;
            }
        }

        async function fetchLogs() {
            const logsContainer = document.getElementById('logsContainer');
            if(!logsContainer) return;
            
            const logs = await fetchAPI('/logs');
            logsContainer.innerHTML = logs.map(l => {
                const time = new Date(l.timestamp).toLocaleTimeString();
                return `<div class="mb-1 text-sm log-entry border-b border-slate-800 pb-1">
                    <span class="text-slate-500">[${time}]</span>
                    <span class="font-bold type-${l.type}">${l.type}</span>
                    <span class="text-slate-300">${l.details}</span>
                </div>`
            }).join('');
        }

        function formatUptime(seconds) {
            const h = Math.floor(seconds / 3600);
            const m = Math.floor((seconds % 3600) / 60);
            return `${h}h ${m}m`;
        }

        async function sendBroadcast() {
            const msg = document.getElementById('broadcastMsg').value;
            if (!msg) return;
            const res = await fetchAPI('/broadcast', 'POST', { message: msg });
            alert(`Отправлено ${res.sentTo} пользователям`);
            document.getElementById('broadcastMsg').value = '';
        }

        async function banUser(uid) {
            if (!confirm(`Точно забанить ${uid}? Это удалит пользователя, его магазин и доски.`)) return;
            await fetchAPI('/ban', 'POST', { uid });
            loadTab('users');
        }

        async function kickUser(uid) {
            if (!confirm(`Отключить пользователя ${uid}? (Он сможет подключиться снова)`)) return;
            await fetchAPI('/kick', 'POST', { uid });
            loadTab('users');
        }

        async function deleteStore(uid) {
            if (!confirm('Удалить этот магазин?')) return;
            await fetchAPI(`/stores/${uid}`, 'DELETE');
            loadTab('stores');
        }

        function logout() {
            window.location.reload();
        }

        // Init
        loadTab('dashboard');
    </script>
</body>
</html>
