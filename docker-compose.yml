version: '3.8'

services:
  # Фронтенд (React + Nginx)
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    environment:
      - REACT_APP_API_URL=http://backend:3000
    networks:
      - cipherlink-network

  # Бэкенд (Node.js + Express)
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    ports:
      - "3000:3000"
    volumes:
      # Монтируем SQLite базу данных для персистентности
      - sqlite-data:/app/data
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_PATH=/app/data/cipherlink.db
    networks:
      - cipherlink-network

  # (Опционально) MinIO для хранения файлов
  # minio:
  #   image: minio/minio
  #   ports:
  #     - "9000:9000"
  #     - "9001:9001"
  #   volumes:
  #     - minio-data:/data
  #   environment:
  #     - MINIO_ROOT_USER=minioadmin
  #     - MINIO_ROOT_PASSWORD=minioadmin
  #   command: server /data --console-address ":9001"
  #   networks:
  #     - cipherlink-network

networks:
  cipherlink-network:
    driver: bridge

volumes:
  sqlite-data:
    driver: local
  # minio-data:
  #   driver: local
