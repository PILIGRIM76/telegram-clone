version: '3.8'

services:
  # Фронтенд (React + Nginx)
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "4100:80"  # Phase 9: 4100 (ШифроСвязь заняла 3100/8181, electro-manager — 80/3000)
    depends_on:
      - backend
    environment:
      - REACT_APP_API_URL=http://backend:4000
    networks:
      - cipherlink-network

  # Бэкенд (Node.js + Express)
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    ports:
      - "4000:4000"  # Phase 9: 4000 (ШифроСвязь заняла 3100, electro-backend — 3000)
    volumes:
      # Монтируем SQLite базу данных для персистентности
      - sqlite-data:/app/data
    environment:
      - NODE_ENV=production
      - PORT=4000
      - DATABASE_URL=postgresql://cipherlink:cipherlink_password@postgres:5432/cipherlink_db?schema=public
      - REDIS_URL=redis://redis:6379
    networks:
      - cipherlink-network

  postgres:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: cipherlink
      POSTGRES_PASSWORD: cipherlink_password
      POSTGRES_DB: cipherlink_db
    ports:
      - "5434:5432"  # Phase 9: 5434 (ШифроСвязь на 5433, electro на 5432)
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - cipherlink-network

  redis:
    image: redis:7-alpine
    restart: always
    ports:
      - "6381:6379"  # Phase 9: 6381 (electro на 6380)
    networks:
      - cipherlink-network

  # v2.0 Stage 2: Nginx TLS reverse proxy (TLS терминация для WSS)
  nginx-tls:
    image: nginx:1.27-alpine
    container_name: piligrim-nginx-tls
    restart: unless-stopped
    ports:
      - "4443:4443"  # HTTPS + WSS endpoint
    volumes:
      # Конфигурация Nginx (read-only)
      - ./nginx-tls.conf:/etc/nginx/conf.d/default.conf:ro
      # TLS-сертификаты (read-only, из Шага 1)
      - ./certs/piligrim-server.crt:/etc/nginx/certs/piligrim-server.crt:ro
      - ./certs/piligrim-server.key:/etc/nginx/certs/piligrim-server.key:ro
    extra_hosts:
      # Позволяет Docker-контейнеру видеть хост через host.docker.internal
      # (доступно в Docker Desktop на Windows/Mac)
      - "host.docker.internal:host-gateway"
    networks:
      - cipherlink-network
    depends_on:
      - backend

  # (Опционально) MinIO для хранения файлов
  # minio:
  #   image: minio/minio
  #   ports:
  #     - "9000:9000"
  #     - "9001:9001"
  #   volumes:
  #     - minio-data:/data
  #   environment:
  #     - MINIO_ROOT_USER=minioadmin
  #     - MINIO_ROOT_PASSWORD=minioadmin
  #   command: server /data --console-address ":9001"
  #   networks:
  #     - cipherlink-network

networks:
  cipherlink-network:
    driver: bridge

volumes:
  sqlite-data:
    driver: local
  postgres-data:
    driver: local
  # minio-data:
  #   driver: local
