# v2.0 Stage 2: Nginx TLS reverse proxy for PILIGRIM backend
# Терминирует TLS на 4443, проксирует HTTPS + WSS на standalone Node.js на 4000.
# Цель: устранить Mixed Content в Android WebView (HTTPS → WSS).

# WebSocket upgrade mapping (обязательно для WSS)
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 4443 ssl;
    listen [::]:4443 ssl;
    server_name piligrim.local localhost 192.168.100.4;

    # TLS сертификаты (подписаны нашим CA из certs/piligrim-ca.crt)
    ssl_certificate     /etc/nginx/certs/piligrim-server.crt;
    ssl_certificate_key /etc/nginx/certs/piligrim-server.key;

    # Современные протоколы
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Логирование (для дебага TLS handshake)
    access_log /var/log/nginx/piligrim-access.log;
    error_log  /var/log/nginx/piligrim-error.log info;

    # Корневой location: проксируем на standalone Node.js backend
    location / {
        proxy_pass http://host.docker.internal:4000;
        proxy_http_version 1.1;

        # WebSocket upgrade headers (КРИТИЧНО для wss://)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Стандартные прокси-заголовки
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        # Таймауты: 24 часа для WebSocket-соединений
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_connect_timeout 60s;

        # Не буферизировать WS-сообщения
        proxy_buffering off;
        proxy_request_buffering off;
    }
}