<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <!-- v3.0 Phase 1.5: Inter Variable шрифт (premium typography) -->
    <link rel="preconnect" href="https://rsms.me/">
    <link rel="preconnect" href="https://rsms.me/" crossorigin>
    <link rel="stylesheet" href="https://rsms.me/inter/inter.css">
    <!-- Phase 9: PILIGRIM иконки -->
    <link rel="icon" type="image/svg+xml" href="/icons/main.svg" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48x48.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="/pwa-192x192.png" />
    <link rel="apple-touch-icon" sizes="512x512" href="/pwa-512x512.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PILIGRIM</title>
    <!-- Phase 9.5 fix: inline <style> удалён — перенесён в src/index.css.
         Vite html-proxy не работает с inline CSS при наличии vite-plugin-pwa. -->
    <script>
      // Phase 9.5 fix: simple-peer и некоторые Node.js полифиллы ожидают `require` и `global`.
      // В браузере/Capacitor WebView их нет. Определяем no-op shim ДО загрузки bundle.
      window.global = window.global || window;
      if (typeof window.require !== 'function') {
        window.require = function (name) {
          console.warn('[PILIGRIM] require("' + name + '") called in browser — returning empty stub');
          return {};
        };
      }
    </script>
    <script>
      // Phase 9.5 fix: глобальные обработчики ошибок и диагностика ДО загрузки bundle
      window.__PILIGRIM_BOOT__ = { start: Date.now() };
      window.addEventListener('error', function(event) {
        console.error('[PILIGRIM] GLOBAL ERROR:', (event.error && event.error.message) || event.message);
        console.error('[PILIGRIM] GLOBAL ERROR stack:', event.error && event.error.stack);
      });
      window.addEventListener('unhandledrejection', function(event) {
        console.error('[PILIGRIM] UNHANDLED PROMISE:', event.reason);
      });
      console.log('[PILIGRIM] PRE-BOOT: HTML inline script executed');
      console.log('[PILIGRIM] PRE-BOOT: typeof setTimeout =', typeof setTimeout);
      console.log('[PILIGRIM] PRE-BOOT: typeof Promise =', typeof Promise);
      console.log('[PILIGRIM] PRE-BOOT: typeof fetch =', typeof fetch);
      console.log('[PILIGRIM] PRE-BOOT: typeof console =', typeof console);
      console.log('[PILIGRIM] PRE-BOOT: typeof globalThis =', typeof globalThis);
      console.log('[PILIGRIM] PRE-BOOT: typeof window =', typeof window);
    </script>
    <script>
      // Phase 9.5 fix: очищаем Service Worker кэш при каждой загрузке
      // (PWA был отключён в vite.config.ts, но старый SW может остаться)
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(regs) {
          for (var i = 0; i < regs.length; i++) {
            regs[i].unregister().then(function() {
              console.log('[PILIGRIM] Service Worker unregistered');
            });
          }
        });
      }
    </script>
</head>
  <body class="bg-slate-900 text-slate-200">
    <div id="root"></div>
  <script type="module" src="/src/index.tsx"></script>
</body>
</html>
